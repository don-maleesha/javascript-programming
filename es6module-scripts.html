<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Script</title>
</head>
<body>
    JS scripts as modules.
    <script type="module">
        import {sayHi} from './say.js';
        sayHi('John');
    </script>
    <script type="module">
        import {sayHi, sayBye} from './say.js';
        import say from './say.js';
        sayHi('John');
        sayBye('John');
        say();
    </script>
</body>
</html>
